services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: harmony
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: harmony
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmony -d harmony"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${APP_IMAGE:-ghcr.io/zaheria985/harmony_homeschool:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://harmony:${POSTGRES_PASSWORD}@db:5432/harmony
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET - generate with openssl rand -base64 32}"
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Chicago}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # Off by default: the publicly-known parent@harmony.local / harmony123
      # account is NOT created. On a fresh install, create the first account
      # via /signup (allowed while the users table is empty). Set to 1 only if
      # you want the demo login and will change its password immediately.
      SEED_DEFAULT_USER: ${SEED_DEFAULT_USER:-0}
      # iCal feed: the endpoint returns 403 unless one of these is set.
      CALENDAR_ICAL_TOKEN: ${CALENDAR_ICAL_TOKEN:-}
      ICAL_TOKEN: ${ICAL_TOKEN:-}
      # Required for the nightly lesson-bump cron below to authenticate.
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads

  # Nightly "bump overdue lessons forward" run. Without this the bump only
  # happens lazily on page load, which is slow and racy.
  # Requires CRON_SECRET to be set in .env; skips itself if it is empty.
  cron:
    image: curlimages/curl:latest
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      # UTC hour. 23Z = 6pm CDT / 5pm CST — after the school day, matching the
      # existing vercel.json schedule. Do NOT set this near local midnight: the
      # bump uses includeToday, so it would push the new day's lessons forward
      # before that day has even started.
      BUMP_HOUR: ${BUMP_HOUR:-23}
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$CRON_SECRET" ]; then
          echo "[cron] CRON_SECRET is not set — scheduled lesson bumping is DISABLED."
          echo "[cron] Set CRON_SECRET in .env to enable it."
          while true; do sleep 3600; done
        fi
        echo "[cron] started; bump at $${BUMP_HOUR}:00 UTC, digest at $${DIGEST_HOUR}:00 UTC"
        run_job() {
          echo "[cron] $$(date -u) running $$1"
          curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" "http://app:3000/api/cron/$$1" && echo "" || echo "[cron] $$1 failed"
        }
        while true; do
          now=$$(date -u +%H); now=$${now#0}
          next=25; job=""
          for pair in "$${BUMP_HOUR#0}:bump-lessons" "$${DIGEST_HOUR#0}:daily-digest"; do
            hour=$${pair%%:*}; name=$${pair#*:}
            delta=$$(( hour - now )); [ $$delta -le 0 ] && delta=$$(( delta + 24 ))
            if [ $$delta -lt $$next ]; then next=$$delta; job=$$name; fi
          done
          sleep $$(( next * 3600 ))
          run_job "$$job"
          sleep 3600
        done

  # Nightly pg_dump into ./backups on the host. Keeps the last 14 days.
  # Restore:  docker compose exec -T db pg_restore -U harmony -d harmony --clean --if-exists < backups/harmony-YYYYMMDD-HHMMSS.dump
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: harmony
      PGDATABASE: harmony
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # UTC hour. 8Z = 3am CDT / 2am CST — overnight, low usage.
      BACKUP_HOUR: ${BACKUP_HOUR:-8}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]

volumes:
  pgdata:
  uploads:
